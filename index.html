    const liabOpts=state.liabilities.map(l=>`<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('');
    const acctOpts=state.accounts.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');

    const assetTxTables = fAssets.map(a=>{
      const tx=assetTxFor(a.id).slice().reverse();
      if(!tx.length) return '';
      const deltas=assetValuationDeltas(a.id);
      return `<h4 style="margin-top:14px;">${esc(a.name)} activity</h4>
        <table><thead><tr><th>Date</th><th>Type</th><th class="amt">Amount</th><th></th></tr></thead><tbody>
          ${tx.map(t=>{
            const editing=state._editRow===t.id;
            if(editing){
              return `<tr><td><input type="date" data-edit-field="date" value="${esc(t.date)}"></td>
                <td><select data-edit-field="kind"><option value="contribution" ${t.kind==='contribution'?'selected':''}>contribution</option><option value="withdrawal" ${t.kind==='withdrawal'?'selected':''}>withdrawal</option><option value="valuation" ${t.kind==='valuation'?'selected':''}>valuation</option></select></td>
                <td><input type="number" data-edit-field="amount" value="${t.amount}" style="text-align:right;"></td>
                <td class="row-actions"><button data-save-assettx="${t.id}">Save</button><button data-cancel-edit="1">Cancel</button></td></tr>`;
            }
            let amtCell;
            if(t.kind==='valuation'){
              const delta=deltas[t.id]||0;
              amtCell=`<span style="color:${delta>=0?'var(--good)':'var(--bad)'};font-weight:600;">${delta>=0?'+':''}${fmtINR(delta)}</span><div style="font-size:10px;color:var(--ink-soft);">value ${fmtINR(t.amount)}</div>`;
            } else {
              amtCell=(t.kind==='withdrawal'?'-':'')+fmtINR(t.amount);
            }
            let noteBits=[];
            if(t.account) noteBits.push((t.kind==='contribution'?'from ':'to ')+t.account);
            if(t.fromGoalId) noteBits.push('from goal transfer: '+esc((state.goals.find(g=>g.id===t.fromGoalId)||{}).name||'?'));
            if(t.fromAssetId) noteBits.push('from asset transfer: '+esc((state.assets.find(x=>x.id===t.fromAssetId)||{}).name||'?'));
            if(t.toAssetId) noteBits.push('→ '+esc((state.assets.find(x=>x.id===t.toAssetId)||{}).name||'?'));
            const note=noteBits.length? ' <span style="font-size:10px;color:var(--ink-soft);">('+noteBits.join(', ')+')</span>':'';
            return `<tr class="${t.transferId?'transfer-row':''}"><td>${esc(t.date)}</td><td>${t.kind}${note}</td><td class="amt">${amtCell}</td>
              <td class="row-actions"><button data-edit-assettx="${t.id}">Edit</button><button data-del-assettx="${t.id}" data-assettx-transferid="${t.transferId||''}">Delete</button></td></tr>`;
          }).join('')}
        </tbody></table>`;
    }).join('');

    const liabTxTables = fLiabilities.map(l=>{
      const tx=liabilityTxFor(l.id).slice().reverse();
      if(!tx.length) return '';
      return `<h4 style="margin-top:14px;">${esc(l.name)} balance history</h4>
        <table><thead><tr><th>Date</th><th class="amt">Balance</th><th></th></tr></thead><tbody>
          ${tx.map(t=>{
            const editing=state._editRow===t.id;
            if(editing){
              return `<tr><td><input type="date" data-edit-field="date" value="${esc(t.date)}"></td>
                <td><input type="number" data-edit-field="amount" value="${t.amount}" style="text-align:right;"></td>
                <td class="row-actions"><button data-save-liabtx="${t.id}">Save</button><button data-cancel-edit="1">Cancel</button></td></tr>`;
            }
            return `<tr><td>${esc(t.date)}</td><td class="amt">${fmtINR(t.amount)}</td>
              <td class="row-actions"><button data-edit-liabtx="${t.id}">Edit</button><button data-del-liabtx="${t.id}">Delete</button></td></tr>`;
          }).join('')}
        </tbody></table>`;
    }).join('');

    return `
      <div class="filter-bar">
        <div><label>Viewing</label>
          <select id="networth-owner-filter">
            ${filterOptions.map(f=>`<option value="${esc(f)}" ${filter===f?'selected':''}>${esc(filterLabel(f))}</option>`).join('')}
          </select>
        </div>
        ${filter!=='all'? '<div style="align-self:center;font-size:12px;color:var(--ink-soft);padding-bottom:8px;">Showing accounts/assets/liabilities owned by '+esc(filter)+' or Joint. Goal funds '+(includeGoals?'included (Joint).':'excluded from this person-only view.')+'</div>':''}
      </div>
      <div class="summary-row">
        <div class="stat"><div class="label">Total assets</div><div class="value">${fmtINR(totalAssets)}</div></div>
        <div class="stat"><div class="label">Total liabilities</div><div class="value">${fmtINR(totalLiabilities)}</div></div>
        <div class="stat"><div class="label">Net worth</div><div class="value ${netWorth>=0?'good':'bad'}">${fmtINR(netWorth)}</div></div>
        <div class="stat"><div class="label">Goal funds included</div><div class="value">${includeGoals? fmtINR(state.goals.reduce((s,g)=>s+goalBalance(g.id),0)) : '—'}</div></div>
      </div>

      <div class="card">
        <h3>Accounts <span class="pill blue">live balance from your entries</span></h3>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Set an opening balance and owner for each account below. Every income, expense, transfer, and asset contribution/withdrawal you log against it updates the balance automatically.</div>
        <table><thead><tr><th>Account</th><th class="amt">Balance</th><th></th></tr></thead><tbody>
          ${acctRows}
        </tbody></table>
        ${!fAccounts.length? '<div class="empty">No accounts in this view — add one in Setup → Payment modes / accounts.</div>':''}
      </div>

      <div class="card">
        <h3>Assets</h3>
        <table><thead><tr><th>Asset</th><th class="amt">Invested</th><th class="amt">Current value</th><th class="amt">Gain/loss</th><th></th></tr></thead><tbody>
          ${assetRows}${goalRows}
        </tbody></table>
        ${(!fAssets.length && !goalRows)? '<div class="empty">No assets in this view.</div>':''}
        <div class="divider"></div>
        <h4>Add an asset (investment, cash, or bank account)</h4>
        <form id="asset-form" class="form-grid">
          <div><label>Name</label><input type="text" name="name" placeholder="e.g. Zerodha equity, HDFC savings" required></div>
          <div><label>Type</label><select name="type">${ASSET_TYPES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div>
          <div><label>Owner</label><select name="owner">${OWNER_OPTIONS().map(p=>`<option>${esc(p)}</option>`).join('')}</select></div>
          <div><button class="btn" type="submit">Add asset</button></div>
        </form>
        <div class="divider"></div>
        <h4>Log a contribution, withdrawal, valuation, or transfer between assets</h4>
        <form id="asset-tx-form" class="form-grid">
          <div><label>Asset</label><select name="assetId" id="assettx-asset-select">${assetOpts}</select></div>
          <div><label>Date</label><input type="date" name="date" value="${todayDate()}" required></div>
          <div><label>Type</label><select name="kind" id="assettx-kind-select">
            <option value="contribution">Contribution (buy more)</option>
            <option value="withdrawal">Withdrawal (sell / cash out)</option>
            <option value="valuation">Valuation update (current value)</option>
            <option value="transfer">Transfer to another asset (sell this, buy that)</option>
          </select></div>
          <div id="assettx-account-field"><label id="assettx-account-label">Paid from account</label><select name="account" id="assettx-account-select">${acctOpts}</select></div>
          <div id="assettx-destasset-field" style="display:none;"><label>Destination asset</label><select id="assettx-destasset-select">${assetOpts}</select></div>
          <div><label>Amount</label><input type="number" min="0" name="amount" required></div>
          <div><button class="btn" type="submit">Log</button></div>
        </form>
        ${!state.assets.length? '<div class="empty">Add an asset above before logging activity.</div>':''}
        ${!state.accounts.length? '<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Add an account in Setup to enable contribution/withdrawal source tracking.</div>':''}
        ${assetTxTables}
      </div>

      <div class="card">
        <h3>Liabilities</h3>
        <table><thead><tr><th>Liability</th><th class="amt">Opening</th><th class="amt">Current</th><th></th></tr></thead><tbody>
          ${liabRows}
        </tbody></table>
        ${!fLiabilities.length? '<div class="empty">No liabilities in this view.</div>':''}
        <div class="divider"></div>
        <h4>Add a liability</h4>
        <form id="liability-form" class="form-grid">
          <div><label>Name</label><input type="text" name="name" placeholder="e.g. Car loan" required></div>
          <div><label>Type</label><select name="type">${LIABILITY_TYPES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div>
          <div><label>Opening balance</label><input type="number" min="0" name="openingBalance" required></div>
          <div><label>As of date</label><input type="date" name="openingDate" value="${todayDate()}"></div>
          <div><label>Owner</label><select name="owner">${OWNER_OPTIONS().map(p=>`<option>${esc(p)}</option>`).join('')}</select></div>
          <div><button class="btn" type="submit">Add liability</button></div>
        </form>
        <div class="divider"></div>
        <h4>Update outstanding balance</h4>
        <form id="liability-tx-form" class="form-grid">
          <div><label>Liability</label><select name="liabilityId">${liabOpts}</select></div>
          <div><label>Date</label><input type="date" name="date" value="${todayDate()}" required></div>
          <div><label>Current balance</label><input type="number" min="0" name="amount" required></div>
          <div><button class="btn" type="submit">Update</button></div>
        </form>
        ${!state.liabilities.length? '<div class="empty">Add a liability above before updating it.</div>':''}
        ${liabTxTables}
      </div>
    `;
  }


  // ---------------- SETUP ----------------
  function setupHTML(){
    const versions=state.allocationVersions.slice().sort((a,b)=>b.effectiveMonth.localeCompare(a.effectiveMonth));
    const editingMonth=state._editingAllocMonth || state.currentMonth;
    const existing=state.allocationVersions.find(v=>v.effectiveMonth===editingMonth);
    const items=planItems();
    let pctRows='';
    items.forEach(item=>{
      let cells=state.people.map(p=>{
        const val=existing && existing.pct[p] && existing.pct[p][item.key]!=null ? existing.pct[p][item.key] : '';
        return `<input type="number" step="0.01" min="0" max="100" data-pct-person="${esc(p)}" data-pct-key="${esc(item.key)}" value="${val}" style="text-align:right;">`;
      }).join('');
      pctRows+=`<div class="pct-input-row"><div>${esc(item.label)}${item.kind==='goal'?' <span class="pill blue">goal</span>':''}</div>${cells}</div>`;
    });
    const peopleHeaders=state.people.map(p=>`<div style="font-size:11px;font-weight:600;color:var(--ink-soft);text-align:right;">${esc(p)}</div>`).join('');

    return `
      <div class="card"><h3>People</h3>
        <div class="tag-list">${state.people.map(p=>`<span class="tag">${esc(p)} <button data-del-person="${esc(p)}">&times;</button></span>`).join('')}</div>
        <div class="add-inline"><input type="text" id="new-person" placeholder="Add person"><button class="btn secondary small" id="add-person-btn">Add</button></div>
      </div>

      <div class="card"><h3>Categories</h3>
        <div class="tag-list">${state.categories.map(c=>`<span class="tag">${esc(c)} <button data-del-category="${esc(c)}">&times;</button></span>`).join('')}</div>
        <div class="add-inline"><input type="text" id="new-category" placeholder="Add category"><button class="btn secondary small" id="add-category-btn">Add</button></div>
      </div>

      <div class="card"><h3>Payment modes / accounts</h3>
        <div class="tag-list">${state.accounts.map(a=>`<span class="tag">${esc(a.name)} <span style="color:var(--ink-soft);">(${esc(a.type)} · ${esc(a.owner||'Joint')})</span> <button data-del-account="${esc(a.name)}">&times;</button></span>`).join('')}</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">Opening balance and liability flag are set on the <b>Net Worth</b> tab once an account exists here.</div>
        <div class="add-inline">
          <input type="text" id="new-account" placeholder="Account name">
          <select id="new-account-type"><option value="cash">Cash</option><option value="card">Card</option><option value="bank">Bank / net banking</option><option value="other">Other</option></select>
          <select id="new-account-owner">${OWNER_OPTIONS().map(p=>`<option>${esc(p)}</option>`).join('')}</select>
          <button class="btn secondary small" id="add-account-btn">Add</button>
        </div>
      </div>

      <div class="card">
        <h3>Allocation plan <span class="pill">versioned by month</span> <span class="pill blue">categories + goals combined</span></h3>
        <div class="form-grid" style="margin-bottom:14px;grid-template-columns:200px 1fr;">
          <div><label>Effective from month</label><input type="month" id="alloc-month" value="${editingMonth}"></div>
        </div>
        <div class="pct-input-row" style="font-weight:600;">
          <div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;">Category / Goal</div>${peopleHeaders}
        </div>
        ${pctRows}
        <div id="pct-sum-area"></div>
        <div style="margin-top:12px;display:flex;gap:10px;">
          <button class="btn" id="save-allocation-btn">Save this version</button>
          ${existing? `<button class="btn secondary" id="delete-allocation-btn">Delete this version</button>`:''}
        </div>
        <div class="divider"></div>
        <div class="subsection-title">Existing versions</div>
        ${versions.length? `<table><thead><tr><th>Effective from</th><th></th></tr></thead><tbody>
          ${versions.map(v=>`<tr><td>${monthLabel(v.effectiveMonth)}</td><td class="row-actions"><button data-load-alloc="${v.effectiveMonth}">Edit</button></td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">No allocation versions saved yet.</div>'}
      </div>

      <div class="card">
        <h3>Export data</h3>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Download everything — income, expenses, transfers, goals, assets, liabilities — as an Excel workbook with one sheet per record type.</div>
        <button class="btn secondary" id="export-btn">Export to Excel</button>
      </div>

      <div class="card">
        <h3>Backup &amp; restore</h3>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Download a complete backup of the raw data file, or restore from a previously downloaded one. Restoring <b>replaces everything</b> currently in the tracker — use with care.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn secondary" id="backup-download-btn">Download backup (.json)</button>
          <label class="btn secondary" style="cursor:pointer;">Restore from backup<input type="file" id="backup-restore-input" accept="application/json,.json" style="display:none;"></label>
        </div>
        <div id="restore-status" style="font-size:12px;color:var(--ink-soft);margin-top:8px;"></div>
      </div>
    `;
  }

  // ---------------- EVENTS ----------------
  function bindTabEvents(){
    document.querySelectorAll('[data-shift]').forEach(b=>b.addEventListener('click',()=>{
      state.currentMonth=shiftMonth(state.currentMonth, parseInt(b.dataset.shift,10));
      saveState(); renderTabContent();
    }));

    if(state.activeTab==='entries'){
      const incForm=document.getElementById('income-form');
      if(incForm) incForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(incForm);
        if(!canEdit(f.get('person'))){ alert("You can only add entries under your own name."); return; }
        state.income.push({id:nextId(), date:f.get('date'), person:f.get('person'), source:f.get('source'), account:f.get('account'), amount:Number(f.get('amount'))});
        await saveState(); renderTabContent();
      });
      const expForm=document.getElementById('expense-form');
      if(expForm) expForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(expForm);
        if(!canEdit(f.get('person'))){ alert("You can only add entries under your own name."); return; }
        const irregular=!!f.get('irregular');
        const reason=f.get('reason');
        if(irregular && !reason){ alert('Please add a reason for this irregular expense.'); return; }
        state.expenses.push({id:nextId(), date:f.get('date'), person:f.get('person'), category:f.get('category'), description:f.get('description'), account:f.get('account'), amount:Number(f.get('amount')), irregular, reason});
        await saveState(); renderTabContent();
      });
      const trnForm=document.getElementById('transfer-form');
      if(trnForm) trnForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(trnForm);
        if(!canEdit(f.get('person'))){ alert("You can only add entries under your own name."); return; }
        state.transfers.push({id:nextId(), date:f.get('date'), person:f.get('person'), fromAccount:f.get('fromAccount'), toAccount:f.get('toAccount'), amount:Number(f.get('amount')), note:f.get('note')});
        await saveState(); renderTabContent();
      });
      document.querySelectorAll('[data-del-income]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.income.find(r=>r.id===b.dataset.delIncome);
        if(!canEdit(row.person)) return;
        state.income=state.income.filter(r=>r.id!==b.dataset.delIncome);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-del-expense]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.expenses.find(r=>r.id===b.dataset.delExpense);
        if(!canEdit(row.person)) return;
        state.expenses=state.expenses.filter(r=>r.id!==b.dataset.delExpense);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-del-transfer]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.transfers.find(r=>r.id===b.dataset.delTransfer);
        if(!canEdit(row.person)) return;
        state.transfers=state.transfers.filter(r=>r.id!==b.dataset.delTransfer);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-income]').forEach(b=>b.addEventListener('click', ()=>{ state._editRow=b.dataset.editIncome; renderTabContent(); }));
      document.querySelectorAll('[data-edit-expense]').forEach(b=>b.addEventListener('click', ()=>{ state._editRow=b.dataset.editExpense; renderTabContent(); }));
      document.querySelectorAll('[data-cancel-edit]').forEach(b=>b.addEventListener('click', ()=>{ state._editRow=null; renderTabContent(); }));
      document.querySelectorAll('[data-save-income]').forEach(b=>b.addEventListener('click', async()=>{
        const id=b.dataset.saveIncome;
        const row=state.income.find(r=>r.id===id);
        document.querySelectorAll('[data-edit-field]').forEach(inp=>{ row[inp.dataset.editField]= inp.type==='number'?Number(inp.value):inp.value; });
        state._editRow=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-save-expense]').forEach(b=>b.addEventListener('click', async()=>{
        const id=b.dataset.saveExpense;
        const row=state.expenses.find(r=>r.id===id);
        document.querySelectorAll('[data-edit-field]').forEach(inp=>{ row[inp.dataset.editField]= inp.type==='number'?Number(inp.value):inp.value; });
        state._editRow=null; await saveState(); renderTabContent();
      }));
      const searchBtn=document.getElementById('search-btn');
      if(searchBtn) searchBtn.addEventListener('click', runSearch);
    }

    if(state.activeTab==='goals'){
      const goalForm=document.getElementById('goal-form');
      if(goalForm) goalForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(goalForm);
        state.goals.push({id:nextId(), name:f.get('name'), targetAmount:Number(f.get('target')), account:f.get('account')});
        await saveState(); renderTabContent();
      });
      const recurringForm=document.getElementById('recurring-form');
      if(recurringForm) recurringForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(recurringForm);
        state.recurringTransfers.push({id:nextId(), goalId:f.get('goalId'), assetId:f.get('assetId'), person:f.get('person'), amount:Number(f.get('amount')), label:f.get('label'), loggedMonths:[]});
        await saveState(); renderTabContent();
      });
      document.querySelectorAll('[data-del-recurring]').forEach(b=>b.addEventListener('click', async()=>{
        state.recurringTransfers=state.recurringTransfers.filter(r=>r.id!==b.dataset.delRecurring);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-log-recurring]').forEach(b=>b.addEventListener('click', async()=>{
        const r=state.recurringTransfers.find(x=>x.id===b.dataset.logRecurring);
        if(!canEdit(r.person)){ alert('Only '+r.person+' can log this transfer.'); return; }
        createLinkedTransfer(r.goalId, r.assetId, r.amount, state.currentMonth+'-01', r.person);
        r.loggedMonths=r.loggedMonths||[]; r.loggedMonths.push(state.currentMonth);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-skip-recurring]').forEach(b=>b.addEventListener('click', async()=>{
        const r=state.recurringTransfers.find(x=>x.id===b.dataset.skipRecurring);
        r.loggedMonths=r.loggedMonths||[]; r.loggedMonths.push(state.currentMonth);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-del-goal]').forEach(b=>b.addEventListener('click', async()=>{
        state.goals=state.goals.filter(g=>g.id!==b.dataset.delGoal);
        state.goalTx=state.goalTx.filter(t=>t.goalId!==b.dataset.delGoal);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-goal]').forEach(b=>b.addEventListener('click', ()=>{ state._editGoalId=b.dataset.editGoal; renderTabContent(); }));
      document.querySelectorAll('[data-cancel-edit-goal]').forEach(b=>b.addEventListener('click', ()=>{ state._editGoalId=null; renderTabContent(); }));
      document.querySelectorAll('[data-save-goal]').forEach(b=>b.addEventListener('click', async()=>{
        const g=state.goals.find(x=>x.id===b.dataset.saveGoal);
        document.querySelectorAll('[data-edit-goal-field]').forEach(inp=>{ g[inp.dataset.editGoalField]= inp.dataset.editGoalField==='targetAmount'?Number(inp.value):inp.value; });
        state._editGoalId=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-goaltx-type]').forEach(sel=>{
        sel.addEventListener('change', ()=>{
          const gid=sel.dataset.goaltxType;
          const field=document.querySelector(`[data-goaltx-assetfield="${gid}"]`);
          if(field) field.style.display = sel.value==='transfer' ? 'block' : 'none';
        });
      });
      document.querySelectorAll('[data-goaltx-submit]').forEach(b=>b.addEventListener('click', async()=>{
        const gid=b.dataset.goaltxSubmit;
        const date=document.querySelector(`[data-goaltx-date="${gid}"]`).value;
        const person=document.querySelector(`[data-goaltx-person="${gid}"]`).value;
        const type=document.querySelector(`[data-goaltx-type="${gid}"]`).value;
        const amount=Number(document.querySelector(`[data-goaltx-amount="${gid}"]`).value||0);
        const reason=document.querySelector(`[data-goaltx-reason="${gid}"]`).value;
        if(!canEdit(person)){ alert("You can only log activity under your own name."); return; }
        if(!amount || amount<=0){ alert('Enter an amount.'); return; }
        if(type==='withdrawal' && !reason){ alert('A reason is required for a withdrawal.'); return; }
        if(type==='transfer'){
          const assetSel=document.querySelector(`[data-goaltx-asset="${gid}"]`);
          if(!assetSel || !assetSel.value){ alert('Choose a destination asset for the transfer.'); return; }
          createLinkedTransfer(gid, assetSel.value, amount, date, person);
        } else {
          state.goalTx.push({id:nextId(), goalId:gid, date, person, type, amount, irregular:type==='withdrawal', reason});
        }
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-goaltx]').forEach(b=>b.addEventListener('click', ()=>{ state._editRow=b.dataset.editGoaltx; renderTabContent(); }));
      document.querySelectorAll('[data-save-goaltx]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.goalTx.find(t=>t.id===b.dataset.saveGoaltx);
        document.querySelectorAll('[data-edit-field]').forEach(inp=>{ row[inp.dataset.editField]= inp.type==='number'?Number(inp.value):inp.value; });
        state._editRow=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-del-goaltx]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.goalTx.find(t=>t.id===b.dataset.delGoaltx);
        if(!canEdit(row.person)) return;
        if(b.dataset.goaltxTransferid){ deleteLinkedTransfer(b.dataset.goaltxTransferid); }
        else { state.goalTx=state.goalTx.filter(t=>t.id!==b.dataset.delGoaltx); }
        await saveState(); renderTabContent();
      }));
    }

    if(state.activeTab==='analytics'){
      const modeSel=document.getElementById('range-mode');
      if(modeSel) modeSel.addEventListener('change', ()=>{ state.analyticsRange.mode=modeSel.value; saveState(); renderTabContent(); });
      const rs=document.getElementById('range-start'), re=document.getElementById('range-end');
      if(rs) rs.addEventListener('change', ()=>{ state.analyticsRange.start=rs.value; saveState(); renderTabContent(); });
      if(re) re.addEventListener('change', ()=>{ state.analyticsRange.end=re.value; saveState(); renderTabContent(); });
      const printBtn=document.getElementById('print-report-btn');
      if(printBtn) printBtn.addEventListener('click', ()=>window.print());
    }

    if(state.activeTab==='networth'){
      const filterSel=document.getElementById('networth-owner-filter');
      if(filterSel) filterSel.addEventListener('change', ()=>{ state.netWorthFilter=filterSel.value; saveState(); renderTabContent(); });
      const assetForm=document.getElementById('asset-form');
      if(assetForm) assetForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(assetForm);
        state.assets.push({id:nextId(), name:f.get('name'), type:f.get('type'), owner:f.get('owner')});
        await saveState(); renderTabContent();
      });
      const kindSel=document.getElementById('assettx-kind-select');
      function updateAssetTxFieldVisibility(){
        if(!kindSel) return;
        const kind=kindSel.value;
        const acctField=document.getElementById('assettx-account-field');
        const acctLabel=document.getElementById('assettx-account-label');
        const destField=document.getElementById('assettx-destasset-field');
        if(acctField) acctField.style.display = (kind==='contribution'||kind==='withdrawal') ? 'block' : 'none';
        if(acctLabel) acctLabel.textContent = kind==='withdrawal' ? 'Deposit into account' : 'Paid from account';
        if(destField) destField.style.display = kind==='transfer' ? 'block' : 'none';
      }
      if(kindSel){ kindSel.addEventListener('change', updateAssetTxFieldVisibility); updateAssetTxFieldVisibility(); }
      const assetTxForm=document.getElementById('asset-tx-form');
      if(assetTxForm) assetTxForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(assetTxForm);
        const kind=f.get('kind'), assetId=f.get('assetId'), amount=Number(f.get('amount')), date=f.get('date');
        if(kind==='transfer'){
          const destSel=document.getElementById('assettx-destasset-select');
          const destId=destSel?destSel.value:null;
          if(!destId || destId===assetId){ alert('Choose a different destination asset.'); return; }
          createLinkedAssetTransfer(assetId, destId, amount, date);
        } else if(kind==='contribution' || kind==='withdrawal'){
          const acctSel=document.getElementById('assettx-account-select');
          const account=acctSel?acctSel.value:null;
          if(!account){ alert('Choose the account this money is moving '+(kind==='withdrawal'?'into.':'from.')); return; }
          state.assetTx.push({id:nextId(), assetId, date, kind, amount, account});
        } else {
          state.assetTx.push({id:nextId(), assetId, date, kind, amount});
        }
        await saveState(); renderTabContent();
      });
      document.querySelectorAll('[data-del-asset]').forEach(b=>b.addEventListener('click', async()=>{
        state.assets=state.assets.filter(a=>a.id!==b.dataset.delAsset);
        state.assetTx=state.assetTx.filter(t=>t.assetId!==b.dataset.delAsset);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-asset]').forEach(b=>b.addEventListener('click', ()=>{ state._editAssetId=b.dataset.editAsset; renderTabContent(); }));
      document.querySelectorAll('[data-edit-acctbal]').forEach(b=>b.addEventListener('click', ()=>{ state._editAcctBalId=b.dataset.editAcctbal; renderTabContent(); }));
      document.querySelectorAll('[data-cancel-edit-acctbal]').forEach(b=>b.addEventListener('click', ()=>{ state._editAcctBalId=null; renderTabContent(); }));
      document.querySelectorAll('[data-save-acctbal]').forEach(b=>b.addEventListener('click', async()=>{
        const acct=state.accounts.find(a=>a.name===b.dataset.saveAcctbal);
        document.querySelectorAll('[data-edit-acctbal-field]').forEach(inp=>{
          const field=inp.dataset.editAcctbalField;
          if(field==='isLiability') acct.isLiability=inp.checked;
          else if(field==='openingBalance') acct.openingBalance=Number(inp.value||0);
          else if(field==='owner') acct.owner=inp.value;
          else acct.openingDate=inp.value;
        });
        state._editAcctBalId=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-cancel-edit-asset]').forEach(b=>b.addEventListener('click', ()=>{ state._editAssetId=null; renderTabContent(); }));
      document.querySelectorAll('[data-save-asset]').forEach(b=>b.addEventListener('click', async()=>{
        const a=state.assets.find(x=>x.id===b.dataset.saveAsset);
        document.querySelectorAll('[data-edit-asset-field]').forEach(inp=>{ a[inp.dataset.editAssetField]=inp.value; });
        state._editAssetId=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-assettx]').forEach(b=>b.addEventListener('click', ()=>{ state._editRow=b.dataset.editAssettx; renderTabContent(); }));
      document.querySelectorAll('[data-save-assettx]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.assetTx.find(t=>t.id===b.dataset.saveAssettx);
        document.querySelectorAll('[data-edit-field]').forEach(inp=>{ row[inp.dataset.editField]= inp.type==='number'?Number(inp.value):inp.value; });
        state._editRow=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-del-assettx]').forEach(b=>b.addEventListener('click', async()=>{
        if(b.dataset.assettxTransferid){ deleteLinkedTransfer(b.dataset.assettxTransferid); }
        else { state.assetTx=state.assetTx.filter(t=>t.id!==b.dataset.delAssettx); }
        await saveState(); renderTabContent();
      }));
      const liabForm=document.getElementById('liability-form');
      if(liabForm) liabForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(liabForm);
        state.liabilities.push({id:nextId(), name:f.get('name'), type:f.get('type'), openingBalance:Number(f.get('openingBalance')), openingDate:f.get('openingDate'), owner:f.get('owner')});
        await saveState(); renderTabContent();
      });
      const liabTxForm=document.getElementById('liability-tx-form');
      if(liabTxForm) liabTxForm.addEventListener('submit', async(e)=>{
        e.preventDefault();
        const f=new FormData(liabTxForm);
        state.liabilityTx.push({id:nextId(), liabilityId:f.get('liabilityId'), date:f.get('date'), amount:Number(f.get('amount'))});
        await saveState(); renderTabContent();
      });
      document.querySelectorAll('[data-del-liability]').forEach(b=>b.addEventListener('click', async()=>{
        state.liabilities=state.liabilities.filter(l=>l.id!==b.dataset.delLiability);
        state.liabilityTx=state.liabilityTx.filter(t=>t.liabilityId!==b.dataset.delLiability);
        await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-liability]').forEach(b=>b.addEventListener('click', ()=>{ state._editLiabilityId=b.dataset.editLiability; renderTabContent(); }));
      document.querySelectorAll('[data-cancel-edit-liab]').forEach(b=>b.addEventListener('click', ()=>{ state._editLiabilityId=null; renderTabContent(); }));
      document.querySelectorAll('[data-save-liability]').forEach(b=>b.addEventListener('click', async()=>{
        const l=state.liabilities.find(x=>x.id===b.dataset.saveLiability);
        document.querySelectorAll('[data-edit-liab-field]').forEach(inp=>{ l[inp.dataset.editLiabField]= inp.dataset.editLiabField==='openingBalance'?Number(inp.value):inp.value; });
        state._editLiabilityId=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-edit-liabtx]').forEach(b=>b.addEventListener('click', ()=>{ state._editRow=b.dataset.editLiabtx; renderTabContent(); }));
      document.querySelectorAll('[data-save-liabtx]').forEach(b=>b.addEventListener('click', async()=>{
        const row=state.liabilityTx.find(t=>t.id===b.dataset.saveLiabtx);
        document.querySelectorAll('[data-edit-field]').forEach(inp=>{ row[inp.dataset.editField]= inp.type==='number'?Number(inp.value):inp.value; });
        state._editRow=null; await saveState(); renderTabContent();
      }));
      document.querySelectorAll('[data-del-liabtx]').forEach(b=>b.addEventListener('click', async()=>{
        state.liabilityTx=state.liabilityTx.filter(t=>t.id!==b.dataset.delLiabtx);
        await saveState(); renderTabContent();
      }));
    }

    if(state.activeTab==='setup'){
      const addPersonBtn=document.getElementById('add-person-btn');
      if(addPersonBtn) addPersonBtn.addEventListener('click', async()=>{
        const inp=document.getElementById('new-person'); const v=inp.value.trim();
        if(v && !state.people.includes(v)){ state.people.push(v); await saveState(); renderTabContent(); }
      });
      document.querySelectorAll('[data-del-person]').forEach(b=>b.addEventListener('click', async()=>{
        state.people=state.people.filter(p=>p!==b.dataset.delPerson); await saveState(); renderTabContent();
      }));
      const addCatBtn=document.getElementById('add-category-btn');
      if(addCatBtn) addCatBtn.addEventListener('click', async()=>{
        const inp=document.getElementById('new-category'); const v=inp.value.trim();
        if(v && !state.categories.includes(v)){ state.categories.push(v); await saveState(); renderTabContent(); }
      });
      document.querySelectorAll('[data-del-category]').forEach(b=>b.addEventListener('click', async()=>{
        state.categories=state.categories.filter(c=>c!==b.dataset.delCategory); await saveState(); renderTabContent();
      }));
      const addAcctBtn=document.getElementById('add-account-btn');
      if(addAcctBtn) addAcctBtn.addEventListener('click', async()=>{
        const inp=document.getElementById('new-account'); const v=inp.value.trim();
        const type=document.getElementById('new-account-type').value;
        const owner=document.getElementById('new-account-owner').value;
        if(v && !state.accounts.find(a=>a.name===v)){ state.accounts.push({name:v,type,owner}); await saveState(); renderTabContent(); }
      });
      document.querySelectorAll('[data-del-account]').forEach(b=>b.addEventListener('click', async()=>{
        state.accounts=state.accounts.filter(a=>a.name!==b.dataset.delAccount); await saveState(); renderTabContent();
      }));

      const allocMonthInp=document.getElementById('alloc-month');
      if(allocMonthInp) allocMonthInp.addEventListener('change', ()=>{ state._editingAllocMonth=allocMonthInp.value; renderTabContent(); });
      function updatePctSum(){
        const area=document.getElementById('pct-sum-area'); if(!area) return;
        let html='';
        state.people.forEach(p=>{
          let sum=0;
          document.querySelectorAll(`[data-pct-person="${CSS.escape(p)}"]`).forEach(inp=>{ sum+=Number(inp.value||0); });
          const ok=Math.abs(sum-100)<0.5;
          html+=`<div class="pct-sum ${ok?'good':'bad'}">${esc(p)} total: ${sum.toFixed(2)}%${ok?' ✓':' (should be 100%)'}</div>`;
        });
        area.innerHTML=html;
      }
      document.querySelectorAll('[data-pct-person]').forEach(inp=>inp.addEventListener('input', updatePctSum));
      updatePctSum();

      const saveBtn=document.getElementById('save-allocation-btn');
      if(saveBtn) saveBtn.addEventListener('click', async()=>{
        const month=document.getElementById('alloc-month').value;
        const pct={}; state.people.forEach(p=>{ pct[p]={}; });
        document.querySelectorAll('[data-pct-person]').forEach(inp=>{ pct[inp.dataset.pctPerson][inp.dataset.pctKey]=Number(inp.value||0); });
        const idx=state.allocationVersions.findIndex(v=>v.effectiveMonth===month);
        const entry={effectiveMonth:month, pct};
        if(idx>=0) state.allocationVersions[idx]=entry; else state.allocationVersions.push(entry);
        state._editingAllocMonth=month; await saveState(); renderTabContent();
      });
      const delBtn=document.getElementById('delete-allocation-btn');
      if(delBtn) delBtn.addEventListener('click', async()=>{
        const month=document.getElementById('alloc-month').value;
        state.allocationVersions=state.allocationVersions.filter(v=>v.effectiveMonth!==month);
        await saveState(); renderTabContent();
      });
      document.querySelectorAll('[data-load-alloc]').forEach(b=>b.addEventListener('click', ()=>{ state._editingAllocMonth=b.dataset.loadAlloc; renderTabContent(); }));

      const exportBtn=document.getElementById('export-btn');
      if(exportBtn) exportBtn.addEventListener('click', exportToExcel);

      const backupBtn=document.getElementById('backup-download-btn');
      if(backupBtn) backupBtn.addEventListener('click', ()=>{
        const blob=new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download='income-allocation-tracker-backup-'+todayDate()+'.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
      const restoreInput=document.getElementById('backup-restore-input');
      if(restoreInput) restoreInput.addEventListener('change', (e)=>{
        const file=e.target.files[0];
        if(!file) return;
        const statusEl=document.getElementById('restore-status');
        const reader=new FileReader();
        reader.onload=async()=>{
          let parsed;
          try{ parsed=JSON.parse(reader.result); }
          catch(err){ statusEl.textContent='That file is not valid JSON — restore cancelled.'; statusEl.style.color='var(--bad)'; return; }
          const looksValid = parsed && Array.isArray(parsed.income) && Array.isArray(parsed.expenses) && Array.isArray(parsed.people);
          if(!looksValid){ statusEl.textContent="That file doesn't look like a tracker backup — restore cancelled."; statusEl.style.color='var(--bad)'; return; }
          const ok=confirm('This will replace ALL current data in the tracker with the contents of this backup file. This cannot be undone. Continue?');
          if(!ok){ statusEl.textContent='Restore cancelled.'; statusEl.style.color='var(--ink-soft)'; return; }
          state=Object.assign(defaultState(), parsed);
          await saveState();
          statusEl.textContent='Restored successfully from '+file.name+'.'; statusEl.style.color='var(--good)';
          renderTabContent();
        };
        reader.readAsText(file);
      });
    }
  }

  (async function init(){
    await initGoogle();
    const app=document.getElementById('app');
    app.innerHTML=loginHTML();
    bindLoginEvents();
  })();
})();
</script>
</body>
</html>
