<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income and allocation tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#182530; --ink-soft:#4b5b66;
    --paper:#f3f2ec; --card:#fffefb;
    --line:#d9d6c8; --line-soft:#e8e6da;
    --brass:#c1893a; --brass-bg:#f5e6cc;
    --good:#1f8f5f; --good-bg:#dff3e8;
    --bad:#d1483a; --bad-bg:#fbe4e0;
    --blue:#3167ad; --blue-bg:#e2ebfa;
    --serif:'Fraunces', serif; --sans:'Inter', sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  #app{max-width:1150px;margin:0 auto;padding:28px 24px 80px;}
  .app-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .app-title{font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:-0.01em;}
  .app-title small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}
  .session-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
  .session-bar b{color:var(--ink);}
  .session-bar button{border:none;background:none;color:var(--blue);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;}

  .tabs{display:flex;gap:2px;background:var(--line-soft);border-radius:8px;padding:3px;flex-wrap:wrap;margin-bottom:18px;}
  .tab-btn{border:none;background:transparent;font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--ink-soft);}
  .tab-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  .month-nav{display:flex;align-items:center;gap:10px;margin:4px 0 20px;}
  .month-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--ink);}
  .month-nav button:hover{background:var(--line-soft);}
  .month-label{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.02em;min-width:120px;text-align:center;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  .card h3{margin:0 0 14px;font-family:var(--serif);font-size:17px;font-weight:600;}
  .card h4{margin:0 0 10px;font-family:var(--serif);font-size:14px;font-weight:600;}

  .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:600;}
  .stat .value{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px;}
  .stat .value.bad{color:var(--bad);} .stat .value.good{color:var(--good);}

  .people-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:760px){.people-grid{grid-template-columns:1fr;} .summary-row{grid-template-columns:repeat(2,1fr);}}

  .person-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .person-head{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:baseline;}
  .person-name{font-family:var(--serif);font-weight:600;font-size:18px;}
  .person-income{font-family:var(--mono);font-size:13px;color:var(--ink-soft);}

  .cat-row{padding:12px 18px;border-bottom:1px solid var(--line-soft);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row.goal-plan{background:var(--blue-bg);}
  .cat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
  .cat-name{font-size:13px;font-weight:600;}
  .cat-amts{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .cat-amts b{color:var(--ink);}
  .bar-track{position:relative;height:9px;background:var(--line-soft);border-radius:5px;overflow:hidden;}
  .bar-planned{position:absolute;top:0;left:0;height:100%;border-right:2px solid var(--ink-soft);opacity:.35;background:var(--ink-soft);}
  .bar-actual{position:absolute;top:0;left:0;height:100%;border-radius:5px;background:var(--brass);}
  .bar-actual.over{background:var(--bad);}
  .cat-variance{font-family:var(--mono);font-size:11px;margin-top:5px;}
  .cat-variance.bad{color:var(--bad);} .cat-variance.good{color:var(--good);}

  .notes li{font-size:13px;margin-bottom:6px;line-height:1.5;}
  .notes li b{font-family:var(--mono);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  td.amt{font-family:var(--mono);text-align:right;white-space:nowrap;}
  tr:hover td{background:#faf9f4;}
  .row-actions button{border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:12px;text-decoration:underline;margin-right:8px;}
  .row-actions button:hover{color:var(--bad);}
  .row-actions button:disabled{color:#c7c5ba;cursor:not-allowed;text-decoration:none;}
  tr.irregular td{background:var(--brass-bg)!important;}
  tr.transfer-row td{background:var(--blue-bg)!important;}
  .flag-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--brass);color:#fff;text-transform:uppercase;letter-spacing:.04em;margin-left:6px;}
  .flag-pill.blue{background:var(--blue);}
  .warn-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bad-bg);color:var(--bad);margin-left:6px;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;}
  label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  input,select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-family:var(--sans);font-size:13px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}
  input:disabled,select:disabled{background:#f1f0eb;color:#a3a196;}
  .checkbox-row{display:flex;align-items:center;gap:6px;}
  .checkbox-row input{width:auto;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;background:var(--ink);color:#fff;}
  .btn:hover{background:#0e181f;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--line-soft);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .subsection-title{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 12px;}
  .divider{height:1px;background:var(--line);margin:22px 0;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--brass-bg);color:#7a5518;margin-left:8px;}
  .pill.blue{background:var(--blue-bg);color:var(--blue);}
  .empty{color:var(--ink-soft);font-size:13px;padding:16px 0;text-align:center;}
  .pct-input-row{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:8px;align-items:center;margin-bottom:8px;}
  .pct-sum{font-family:var(--mono);font-size:12px;margin-top:8px;}
  .pct-sum.bad{color:var(--bad);} .pct-sum.good{color:var(--good);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .tag-list{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{display:flex;align-items:center;gap:6px;background:var(--line-soft);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;}
  .tag button{border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:13px;line-height:1;padding:2px 4px;}
  .tag button:hover{color:var(--bad);}
  .add-inline{display:flex;gap:8px;margin-top:8px;}
  .add-inline input,.add-inline select{flex:1;}
  .loading-msg{padding:60px 0;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:13px;}

  .login-wrap{max-width:400px;margin:70px auto;text-align:center;}
  .login-wrap .card{text-align:left;}
  .login-note{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  .g-signin-btn{display:flex;justify-content:center;margin:14px 0;}

  .goal-card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:var(--card);}
  .goal-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .goal-name{font-family:var(--serif);font-weight:600;font-size:16px;}
  .goal-sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .progress-track{height:14px;background:var(--line-soft);border-radius:7px;overflow:hidden;position:relative;margin:8px 0;}
  .progress-fill{height:100%;background:var(--blue);border-radius:7px;}
  .progress-fill.done{background:var(--good);}

  .filter-bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px;}
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:800px){.chart-row{grid-template-columns:1fr;}}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .banner{background:var(--brass-bg);border:1px solid var(--brass);color:#5c470f;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .banner.blue{background:var(--blue-bg);border-color:var(--blue);color:#1d3a63;}
  .banner-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .banner-row:last-child{margin-bottom:0;}

  @media (max-width:700px){
    #app{padding:16px 12px 60px;}
    .app-title{font-size:22px;}
    .app-title small{font-size:10px;}
    .session-bar{font-size:11px;}
    .card{padding:14px 14px;}
    .card h3{font-size:15px;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab-btn{flex:0 0 auto;padding:9px 13px;font-size:12.5px;}
    .card{overflow-x:auto;}
    table{min-width:520px;}
    input,select{font-size:16px;padding:10px 9px;}
    .btn, .btn.small{padding:11px 16px;min-height:40px;}
    .btn.small{min-height:34px;padding:8px 12px;}
    .row-actions button{padding:6px 2px;font-size:12.5px;}
    .form-grid{grid-template-columns:1fr 1fr;}
    .summary-row{grid-template-columns:1fr 1fr;gap:8px;}
    .stat{padding:11px 12px;}
    .stat .value{font-size:17px;}
    .login-wrap{margin:32px auto;max-width:100%;}
    .month-nav button{width:36px;height:36px;}
    .goal-card .form-grid{grid-template-columns:1fr 1fr;}
    .pct-input-row{grid-template-columns:1fr;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);margin-bottom:10px;}
    .pct-input-row input{text-align:left;}
  }
  @media (max-width:420px){
    .summary-row{grid-template-columns:1fr 1fr;}
    .form-grid, .goal-card .form-grid{grid-template-columns:1fr;}
    .app-title{font-size:20px;}
  }

  @media print{
    .tabs, .app-header .session-bar, .month-nav, .no-print{display:none!important;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading-msg">Opening the ledger…</div></div>
<script>
(function(){
  // ====== ONE-TIME CONFIG — fill these in before deploying ======
  const GOOGLE_CLIENT_ID = '59624589658-cteg9emquru3feffjgkldp79db5b6dtf.apps.googleusercontent.com';
  const DATA_FILE_NAME = 'income-allocation-tracker-data.json';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email';
  // ================================================================

  const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DEFAULT_CATEGORIES=["Investment","Monthly Expenses","EMI","Dad Payment","Miscellaneous"];
  const DEFAULT_PEOPLE=["Eshan","Kriti"];
  const DEFAULT_ACCOUNTS=[{name:"Cash",type:"cash"},{name:"HDFC Card",type:"card"},{name:"Net Banking",type:"bank"}];
  const CHART_COLORS=["#3167ad","#e0763f","#1f8f5f","#c4457a","#8a5bc4","#d4a017","#2f9aa0","#a8383b","#5f8f2f","#c1893a"];
  const ASSET_TYPES=["Equity","Mutual Fund","Gold","Fixed Deposit","Real Estate","Cash","Bank Account","Other"];
  const LIABILITY_TYPES=["Loan","Credit Card","Other"];

  let state=null;
  let session={loggedInAs:null, email:null, accessToken:null, driveFileId:null};
  let demoMode=false;
  let uid=1;
  function nextId(){return 'id'+(uid++)+'-'+Math.random().toString(36).slice(2,7);}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmtINR(n){
    n=Math.round(n||0);
    const neg=n<0; n=Math.abs(n);
    let s=n.toString();
    let last3=s.length>3?s.slice(-3):s;
    let rest=s.length>3?s.slice(0,-3):'';
    if(rest!=''){ rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,','); }
    let out=(rest?rest+',':'')+last3;
    return (neg?'-':'')+'₹'+out;
  }
  function monthLabel(m){ const [y,mm]=m.split('-'); return MONTHS[parseInt(mm,10)-1]+' '+y.slice(2); }
  function shiftMonth(m,delta){
    let [y,mm]=m.split('-').map(Number);
    mm+=delta;
    while(mm>12){mm-=12;y+=1;}
    while(mm<1){mm+=12;y-=1;}
    return y+'-'+String(mm).padStart(2,'0');
  }
  function currentRealMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function todayDate(){ const d=new Date(); return d.toISOString().slice(0,10); }
  function monthsBetween(start,end){
    let out=[]; let cur=start; let guard=0;
    while(cur<=end && guard<600){ out.push(cur); cur=shiftMonth(cur,1); guard++; }
    return out;
  }
  function fyBounds(refMonth){
    let [y,mm]=refMonth.split('-').map(Number);
    let startYear = mm>=4 ? y : y-1;
    return {start:startYear+'-04', end:(startYear+1)+'-03'};
  }
  function halfBounds(refMonth){
    const fy=fyBounds(refMonth);
    const [y]=fy.start.split('-').map(Number);
    const [ry,rm]=refMonth.split('-').map(Number);
    if(rm>=4 && rm<=9) return {start:y+'-04', end:y+'-09'};
    return {start:(rm>=10?y:y)+'-10', end:(rm>=10?y+1:y+1)+'-03'};
  }
  function quarterBounds(refMonth){
    const fy=fyBounds(refMonth);
    const [fyYear]=fy.start.split('-').map(Number);
    const quarters=[[fyYear+'-04',fyYear+'-06'],[fyYear+'-07',fyYear+'-09'],[fyYear+'-10',fyYear+'-12'],[(fyYear+1)+'-01',(fyYear+1)+'-03']];
    for(const q of quarters){ if(refMonth>=q[0] && refMonth<=q[1]) return {start:q[0],end:q[1]}; }
    return {start:refMonth,end:refMonth};
  }

  function defaultState(){
    return {
      people: DEFAULT_PEOPLE.slice(),
      categories: DEFAULT_CATEGORIES.slice(),
      accounts: DEFAULT_ACCOUNTS.map(a=>Object.assign({},a)),
      allocationVersions: [],
      goals: [],
      goalTx: [],
      recurringTransfers: [],
      income: [],
      expenses: [],
      transfers: [],
      assets: [],
      assetTx: [],
      liabilities: [],
      liabilityTx: [],
      auth: {personByEmail:{}},
      currentMonth: currentRealMonth(),
      activeTab: 'dashboard',
      analyticsRange: {mode:'month'}
    };
  }

  // ---------------- GOOGLE AUTH + DRIVE ----------------
  let tokenClient=null;
  function initGoogle(){
    return new Promise((resolve)=>{
      const check=setInterval(()=>{
        if(window.google && google.accounts && google.accounts.oauth2){
          clearInterval(check);
          tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:DRIVE_SCOPE, callback:()=>{}});
          resolve();
        }
      },100);
    });
  }
  function requestToken(){
    return new Promise((resolve,reject)=>{
      tokenClient.callback=(resp)=>{
        if(resp.error){ reject(resp); return; }
        session.accessToken=resp.access_token;
        resolve(resp.access_token);
      };
      tokenClient.requestAccessToken({prompt: session.accessToken?'':'consent'});
    });
  }
  async function driveFetch(url, options){
    options=options||{};
    options.headers=Object.assign({}, options.headers, {Authorization:'Bearer '+session.accessToken});
    let res=await fetch(url, options);
    if(res.status===401){
      await requestToken();
      options.headers.Authorization='Bearer '+session.accessToken;
      res=await fetch(url, options);
    }
    return res;
  }
  async function fetchUserEmail(){
    const res=await driveFetch('https://www.googleapis.com/oauth2/v3/userinfo');
    const data=await res.json();
    return data.email;
  }
  async function findOrCreateDriveFile(){
    const q=encodeURIComponent(`name='${DATA_FILE_NAME}' and trashed=false`);
    const searchRes=await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
    const searchData=await searchRes.json();
    if(searchData.files && searchData.files.length) return searchData.files[0].id;
    const metadata={name:DATA_FILE_NAME, mimeType:'application/json'};
    const boundary='ial_boundary_xyz';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(defaultState())}\r\n`+
      `--${boundary}--`;
    const createRes=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
      method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body
    });
    const createData=await createRes.json();
    return createData.id;
  }
  async function loadStateFromDrive(){
    session.driveFileId = await findOrCreateDriveFile();
    const res=await driveFetch(`https://www.googleapis.com/drive/v3/files/${session.driveFileId}?alt=media`);
    const text=await res.text();
    try{ state=Object.assign(defaultState(), JSON.parse(text)); }
    catch(e){ state=defaultState(); }
  }
  let saveTimer=null;
  async function saveState(){
    if(demoMode) return;
    if(!session.driveFileId) return;
    clearTimeout(saveTimer);
    const statusEl=()=>document.getElementById('save-status');
    if(statusEl()) statusEl().textContent='Saving…';
    saveTimer=setTimeout(async()=>{
      try{
        await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${session.driveFileId}?uploadType=media`,{
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state)
        });
        if(statusEl()) statusEl().textContent='Saved '+new Date().toLocaleTimeString();
      }catch(e){ console.error('Drive save failed', e); if(statusEl()) statusEl().textContent='Save failed — check connection'; }
    }, 300);
  }
  async function refreshFromDrive(){
    if(demoMode || !session.driveFileId) return;
    const el=document.getElementById('save-status');
    if(el) el.textContent='Refreshing…';
    const keepTab=state.activeTab, keepMonth=state.currentMonth;
    await loadStateFromDrive();
    state.activeTab=keepTab; state.currentMonth=keepMonth;
    renderTabContent();
    const el2=document.getElementById('save-status');
    if(el2) el2.textContent='Refreshed '+new Date().toLocaleTimeString();
  }

  function canEdit(personOfEntry){ return session.loggedInAs && session.loggedInAs===personOfEntry; }
  function isLoggedIn(){ return !!session.loggedInAs; }

  // ---- plan items (categories + goals combined for allocation %) ----
  function planItems(){
    const cats=state.categories.map(c=>({key:'cat:'+c, label:c, kind:'cat', ref:c}));
    const gls=state.goals.map(g=>({key:'goal:'+g.id, label:g.name, kind:'goal', ref:g.id}));
    return cats.concat(gls);
  }
  function allocationForMonth(month){
    const versions=state.allocationVersions.slice().sort((a,b)=>a.effectiveMonth.localeCompare(b.effectiveMonth));
    let applicable=null;
    for(const v of versions){ if(v.effectiveMonth<=month) applicable=v; }
    return applicable||null;
  }
  function monthIncomeByPerson(month){
    const out={}; state.people.forEach(p=>out[p]=0);
    state.income.filter(e=>e.date.slice(0,7)===month).forEach(e=>{ out[e.person]=(out[e.person]||0)+Number(e.amount); });
    return out;
  }
  function monthExpenseByPersonCategory(month){
    const out={};
    state.people.forEach(p=>{ out[p]={}; state.categories.forEach(c=>out[p][c]=0); });
    state.expenses.filter(e=>e.date.slice(0,7)===month && !e.irregular).forEach(e=>{
      if(!out[e.person]) out[e.person]={};
      out[e.person][e.category]=(out[e.person][e.category]||0)+Number(e.amount);
    });
    return out;
  }
  function goalTxForGoal(goalId){ return state.goalTx.filter(t=>t.goalId===goalId); }
  function goalBalance(goalId){
    let bal=0;
    goalTxForGoal(goalId).forEach(t=>{ bal += t.type==='contribution'?Number(t.amount):-Number(t.amount); });
    return bal;
  }
  function goalBalanceAsOf(goalId,dateStr){
    let bal=0;
    goalTxForGoal(goalId).filter(t=>t.date<=dateStr).forEach(t=>{ bal += t.type==='contribution'?Number(t.amount):-Number(t.amount); });
    return bal;
  }
  function goalMonthContribution(goalId, month, person){
    return goalTxForGoal(goalId).filter(t=>t.type==='contribution' && t.date.slice(0,7)===month && (!person||t.person===person)).reduce((s,t)=>s+Number(t.amount),0);
  }
  function planItemPlannedActual(item, person, month, incomeForPerson){
    const alloc=allocationForMonth(month);
    const pct=(alloc && alloc.pct[person] && alloc.pct[person][item.key])||0;
    const planned=incomeForPerson*pct/100;
    let actual=0;
    if(item.kind==='cat'){
      const expByPC=monthExpenseByPersonCategory(month);
      actual=(expByPC[person]&&expByPC[person][item.ref])||0;
    } else {
      actual=goalMonthContribution(item.ref, month, person);
    }
    return {pct,planned,actual};
  }

  // ---- linked goal->asset transfers ----
  function createLinkedTransfer(goalId, assetId, amount, date, person){
    const tid=nextId();
    state.goalTx.push({id:nextId(), goalId, date, person, type:'transfer', amount, transferId:tid, toAssetId:assetId});
    state.assetTx.push({id:nextId(), assetId, date, kind:'contribution', amount, transferId:tid, fromGoalId:goalId});
    return tid;
  }
  function deleteLinkedTransfer(transferId){
    state.goalTx=state.goalTx.filter(t=>t.transferId!==transferId);
    state.assetTx=state.assetTx.filter(t=>t.transferId!==transferId);
  }
  function createLinkedAssetTransfer(fromAssetId, toAssetId, amount, date){
    const tid=nextId();
    state.assetTx.push({id:nextId(), assetId:fromAssetId, date, kind:'withdrawal', amount, transferId:tid, toAssetId:toAssetId});
    state.assetTx.push({id:nextId(), assetId:toAssetId, date, kind:'contribution', amount, transferId:tid, fromAssetId:fromAssetId});
    return tid;
  }
  function pendingRecurringTransfers(){
    const month=state.currentMonth;
    return state.recurringTransfers.filter(r=>!(r.loggedMonths||[]).includes(month));
  }

  // ---- Net worth helpers ----
  function assetTxFor(assetId){ return state.assetTx.filter(t=>t.assetId===assetId).sort((a,b)=>a.date.localeCompare(b.date)); }
  function assetValuationDeltas(assetId){
    let baseline=0, deltas={};
    assetTxFor(assetId).forEach(t=>{
      if(t.kind==='contribution'){ baseline+=Number(t.amount); }
      else if(t.kind==='withdrawal'){ baseline-=Number(t.amount); }
      else if(t.kind==='valuation'){ deltas[t.id]=Number(t.amount)-baseline; baseline=Number(t.amount); }
    });
    return deltas;
  }
  function assetInvested(assetId){
    let sum=0;
    assetTxFor(assetId).forEach(t=>{ if(t.kind==='contribution') sum+=Number(t.amount); else if(t.kind==='withdrawal') sum-=Number(t.amount); });
    return sum;
  }
  function assetInvestedAsOf(assetId,dateStr){
    let sum=0;
    assetTxFor(assetId).filter(t=>t.date<=dateStr).forEach(t=>{ if(t.kind==='contribution') sum+=Number(t.amount); else if(t.kind==='withdrawal') sum-=Number(t.amount); });
    return sum;
  }
  function assetCurrentValue(assetId){
    const valuations=assetTxFor(assetId).filter(t=>t.kind==='valuation');
    if(valuations.length) return Number(valuations[valuations.length-1].amount);
    return assetInvested(assetId);
  }
  function assetCurrentValueAsOf(assetId,dateStr){
    const val=assetTxFor(assetId).filter(t=>t.kind==='valuation'&&t.date<=dateStr);
    if(val.length) return Number(val[val.length-1].amount);
    return assetInvestedAsOf(assetId,dateStr);
  }
  function totalInvestedAsOf(dateStr){ return state.assets.reduce((s,a)=>s+assetInvestedAsOf(a.id,dateStr),0); }
  function totalCurrentValueAsOf(dateStr){ return state.assets.reduce((s,a)=>s+assetCurrentValueAsOf(a.id,dateStr),0); }
  function liabilityTxFor(liabId){ return state.liabilityTx.filter(t=>t.liabilityId===liabId).sort((a,b)=>a.date.localeCompare(b.date)); }
  function liabilityCurrentBalance(liab){
    const tx=liabilityTxFor(liab.id);
    if(tx.length) return Number(tx[tx.length-1].amount);
    return Number(liab.openingBalance||0);
  }
  function liabilityBalanceAsOf(liab,dateStr){
    const tx=liabilityTxFor(liab.id).filter(t=>t.date<=dateStr);
    if(tx.length) return Number(tx[tx.length-1].amount);
    return (liab.openingDate||'')<=dateStr ? Number(liab.openingBalance||0) : 0;
  }
  function netWorthAsOf(dateStr){
    const assets=totalCurrentValueAsOf(dateStr)+state.goals.reduce((s,g)=>s+goalBalanceAsOf(g.id,dateStr),0);
    const liab=state.liabilities.reduce((s,l)=>s+liabilityBalanceAsOf(l,dateStr),0);
    return assets-liab;
  }
  // ---- real account balance tracking (accounts as ledger accounts, not just labels) ----
  function acctIsLiability(a){ return a.isLiability!=null ? a.isLiability : a.type==='card'; }
  function acctOpeningBalance(a){ return Number(a.openingBalance||0); }
  function acctOpeningDate(a){ return a.openingDate || '0000-01-01'; }
  function acctOwner(a){ return a.owner || 'Joint'; }
  function OWNER_OPTIONS(){ return state.people.concat(['Joint']); }
  function ownerMatches(owner, filter){
    const o=owner||'Joint';
    if(filter==='all') return true;
    if(filter==='Joint') return o==='Joint';
    return o===filter || o==='Joint';
  }
  function accountBalance(acct){ return accountBalanceAsOf(acct, '9999-99-99'); }
  function accountBalanceAsOf(acct,dateStr){
    const openDate=acctOpeningDate(acct);
    let bal=acctOpeningBalance(acct);
    const incomeIn=state.income.filter(e=>e.account===acct.name && e.date>=openDate && e.date<=dateStr).reduce((s,e)=>s+Number(e.amount),0);
    const expenseOut=state.expenses.filter(e=>e.account===acct.name && e.date>=openDate && e.date<=dateStr).reduce((s,e)=>s+Number(e.amount),0);
    const transfersOut=state.transfers.filter(t=>t.fromAccount===acct.name && t.date>=openDate && t.date<=dateStr).reduce((s,t)=>s+Number(t.amount),0);
    const transfersIn=state.transfers.filter(t=>t.toAccount===acct.name && t.date>=openDate && t.date<=dateStr).reduce((s,t)=>s+Number(t.amount),0);
    const assetContribOut=state.assetTx.filter(t=>t.kind==='contribution' && t.account===acct.name && t.date>=openDate && t.date<=dateStr).reduce((s,t)=>s+Number(t.amount),0);
    const assetWithdrawIn=state.assetTx.filter(t=>t.kind==='withdrawal' && t.account===acct.name && t.date>=openDate && t.date<=dateStr).reduce((s,t)=>s+Number(t.amount),0);
    if(acctIsLiability(acct)){
      bal += expenseOut - transfersIn + transfersOut - incomeIn + assetContribOut - assetWithdrawIn;
    } else {
      bal += incomeIn - expenseOut - transfersOut + transfersIn - assetContribOut + assetWithdrawIn;
    }
    return bal;
  }

  // ---- charts ----
  function pieChart(data,size){
    size=size||170;
    const total=data.reduce((s,d)=>s+d.value,0)||1;
    const r=size/2, cx=r, cy=r;
    const nonZero=data.filter(d=>d.value>0);
    if(nonZero.length===1){
      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${nonZero[0].color}"><title>${esc(nonZero[0].label)}: ${fmtINR(nonZero[0].value)}</title></circle></svg>`;
    }
    let cum=0, paths='';
    data.forEach(d=>{
      const start=cum/total*2*Math.PI; cum+=d.value; const end=cum/total*2*Math.PI;
      const x1=cx+r*Math.sin(start), y1=cy-r*Math.cos(start);
      const x2=cx+r*Math.sin(end), y2=cy-r*Math.cos(end);
      const large=(end-start)>Math.PI?1:0;
      if(d.value>0) paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${d.color}"><title>${esc(d.label)}: ${fmtINR(d.value)}</title></path>`;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths||'<circle cx="'+r+'" cy="'+r+'" r="'+r+'" fill="var(--line-soft)"/>'}</svg>`;
  }
  function lineChart(points,width,height,color){
    width=width||520; height=height||150; color=color||'#3167ad';
    const vals=points.map(p=>p.value);
    const max=Math.max(...vals,1), min=Math.min(...vals,0);
    const range=(max-min)||1;
    const stepX=points.length>1?width/(points.length-1):width;
    const coords=points.map((p,i)=>({x:i*stepX,y:height-((p.value-min)/range*height*0.82)-8}));
    const path=coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
    const dots=coords.map((c,i)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="${color}"><title>${esc(points[i].label)}: ${fmtINR(points[i].value)}</title></circle>`).join('');
    const labels=coords.map((c,i)=>`<text x="${c.x.toFixed(1)}" y="${height+13}" font-size="9" text-anchor="middle" fill="#4b5b66">${esc(points[i].label)}</text>`).join('');
    return `<svg viewBox="0 0 ${width} ${height+18}" width="100%" height="${height+18}"><path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${labels}</svg>`;
  }
  function lineChartMulti(seriesList,width,height){
    width=width||520; height=height||160;
    const allVals=seriesList.flatMap(s=>s.points.map(p=>p.value));
    const max=Math.max(...allVals,1), min=Math.min(...allVals,0);
    const range=(max-min)||1;
    const n=seriesList[0].points.length;
    const stepX=n>1?width/(n-1):width;
    let svg='';
    seriesList.forEach(s=>{
      const coords=s.points.map((p,i)=>({x:i*stepX,y:height-((p.value-min)/range*height*0.82)-8}));
      const path=coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
      const dots=coords.map((c,i)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="${s.color}"><title>${esc(s.label)} · ${esc(s.points[i].label)}: ${fmtINR(s.points[i].value)}</title></circle>`).join('');
      svg+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
    });
    const labels=seriesList[0].points.map((p,i)=>`<text x="${(i*stepX).toFixed(1)}" y="${height+13}" font-size="9" text-anchor="middle" fill="#4b5b66">${esc(p.label)}</text>`).join('');
    return `<svg viewBox="0 0 ${width} ${height+18}" width="100%" height="${height+18}">${svg}${labels}</svg>`;
  }
  function groupedBar(labels,plannedArr,actualArr,width){
    width=width||520;
    const max=Math.max(...plannedArr,...actualArr,1);
    const rowH=32; const leftW=140; const height=labels.length*rowH+8;
    let rows='';
    labels.forEach((l,i)=>{
      const y=i*rowH+6;
      const pw=Math.max(0,plannedArr[i]/max*(width-leftW-10));
      const aw=Math.max(0,actualArr[i]/max*(width-leftW-10));
      rows+=`<text x="0" y="${y+9}" font-size="11" fill="#182530">${esc(l)}</text>
        <rect x="${leftW}" y="${y}" width="${pw.toFixed(1)}" height="8" fill="#4b5b66" opacity=".35"/>
        <rect x="${leftW}" y="${y+11}" width="${aw.toFixed(1)}" height="8" fill="${actualArr[i]>plannedArr[i]?'#d1483a':'#c1893a'}"/>`;
    });
    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${rows}</svg>`;
  }
  function barChartSimple(labels,values,width,color){
    width=width||520; color=color||'#c1893a';
    const max=Math.max(...values,1);
    const rowH=28; const height=labels.length*rowH+8;
    let rows='';
    labels.forEach((l,i)=>{
      const y=i*rowH+5;
      const w=Math.max(0,values[i]/max*(width-140));
      rows+=`<text x="0" y="${y+9}" font-size="11" fill="#182530">${esc(l)}</text>
        <rect x="140" y="${y}" width="${w.toFixed(1)}" height="10" fill="${color}"/>
        <text x="${145+w}" y="${y+9}" font-size="10" fill="#4b5b66">${fmtINR(values[i])}</text>`;
    });
    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${rows}</svg>`;
  }

  // ---------------- EXPORT ----------------
  function exportToExcel(){
    if(typeof XLSX==='undefined'){ alert('Export library not loaded — check your internet connection and try again.'); return; }
    const wb=XLSX.utils.book_new();
    function addSheet(name, rows, colWidths){
      if(!rows.length) rows=[{'Note':'No data yet'}];
      const ws=XLSX.utils.json_to_sheet(rows);
      if(colWidths) ws['!cols']=colWidths.map(w=>({wch:w}));
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
    }
    const goalName=id=>{ const g=state.goals.find(x=>x.id===id); return g?g.name:'—'; };
    const assetName=id=>{ const a=state.assets.find(x=>x.id===id); return a?a.name:'—'; };
    const liabName=id=>{ const l=state.liabilities.find(x=>x.id===id); return l?l.name:'—'; };
    const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'');

    // Summary
    const totalAssetsV = state.assets.reduce((s,a)=>s+assetCurrentValue(a.id),0) + state.goals.reduce((s,g)=>s+goalBalance(g.id),0) + state.accounts.filter(a=>!acctIsLiability(a)).reduce((s,a)=>s+accountBalance(a),0);
    const totalLiabV = state.liabilities.reduce((s,l)=>s+liabilityCurrentBalance(l),0) + state.accounts.filter(a=>acctIsLiability(a)).reduce((s,a)=>s+accountBalance(a),0);
    addSheet('Summary', [
      {Metric:'Export date', Value:todayDate()},
      {Metric:'Total assets (₹)', Value:totalAssetsV},
      {Metric:'Total liabilities (₹)', Value:totalLiabV},
      {Metric:'Net worth (₹)', Value:totalAssetsV-totalLiabV},
      {Metric:'Goal funds saved (₹)', Value:state.goals.reduce((s,g)=>s+goalBalance(g.id),0)},
      {Metric:'People', Value:state.people.join(', ')},
    ], [26,20]);

    addSheet('Income', state.income.slice().sort(byDate).map(r=>({
      Date:r.date, Person:r.person, Source:r.source, Account:r.account||'—', 'Amount (₹)':Number(r.amount)
    })), [12,10,22,16,14]);

    addSheet('Expenses', state.expenses.slice().sort(byDate).map(r=>({
      Date:r.date, 'Paid By':r.person, Category:r.category, Description:r.description||'—', Account:r.account||'—',
      'Amount (₹)':Number(r.amount), Irregular:r.irregular?'Yes':'No', Reason:r.reason||'—'
    })), [12,10,18,26,16,14,10,24]);

    addSheet('Transfers', state.transfers.slice().sort(byDate).map(r=>({
      Date:r.date, Person:r.person, 'From Account':r.fromAccount, 'To Account':r.toAccount, 'Amount (₹)':Number(r.amount), Note:r.note||'—'
    })), [12,10,18,18,14,26]);

    addSheet('Accounts', state.accounts.map(a=>({
      Account:a.name, Type:a.type, Owner:a.owner||'Joint', 'Asset or Liability':acctIsLiability(a)?'Liability':'Asset',
      'Opening Balance (₹)':acctOpeningBalance(a), 'Opening Date':a.openingDate||'—', 'Current Balance (₹)':accountBalance(a)
    })), [18,10,10,16,18,14,18]);

    addSheet('Goals', state.goals.map(g=>({
      Name:g.name, 'Target Amount (₹)':Number(g.targetAmount), 'Parked In':g.account||'—', 'Saved So Far (₹)':goalBalance(g.id)
    })), [20,16,16,16]);

    addSheet('Goal Activity', state.goalTx.slice().sort(byDate).map(t=>({
      Date:t.date, Goal:goalName(t.goalId), Person:t.person, Type:t.type, 'Amount (₹)':Number(t.amount),
      Reason:t.reason||'—', 'Linked Asset':t.toAssetId?assetName(t.toAssetId):'—'
    })), [12,18,10,14,14,24,18]);

    addSheet('Assets', state.assets.map(a=>({
      Name:a.name, Type:a.type, Owner:a.owner||'Joint', 'Invested (₹)':assetInvested(a.id), 'Current Value (₹)':assetCurrentValue(a.id), 'Gain/Loss (₹)':assetCurrentValue(a.id)-assetInvested(a.id)
    })), [22,14,10,14,16,14]);

    addSheet('Asset Activity', state.assetTx.slice().sort(byDate).map(t=>{
      let note='—';
      if(t.account) note=(t.kind==='contribution'?'Paid from ':'Deposited to ')+t.account;
      else if(t.fromGoalId) note='From goal transfer: '+goalName(t.fromGoalId);
      else if(t.fromAssetId) note='From asset transfer: '+assetName(t.fromAssetId);
      else if(t.toAssetId) note='Transferred to: '+assetName(t.toAssetId);
      return { Date:t.date, Asset:assetName(t.assetId), Type:t.kind, 'Amount (₹)':Number(t.amount), Note:note };
    }), [12,22,14,14,32]);

    addSheet('Liabilities', state.liabilities.map(l=>({
      Name:l.name, Type:l.type, Owner:l.owner||'Joint', 'Opening Balance (₹)':Number(l.openingBalance), 'Opening Date':l.openingDate||'—', 'Current Balance (₹)':liabilityCurrentBalance(l)
    })), [20,14,10,18,14,18]);

    addSheet('Liability Updates', state.liabilityTx.slice().sort(byDate).map(t=>({
      Date:t.date, Liability:liabName(t.liabilityId), 'Balance (₹)':Number(t.amount)
    })), [12,20,14]);

    let allocRows=[];
    state.allocationVersions.slice().sort((a,b)=>a.effectiveMonth.localeCompare(b.effectiveMonth)).forEach(v=>{
      state.people.forEach(p=>{
        Object.keys(v.pct[p]||{}).forEach(key=>{
          const label = key.startsWith('goal:') ? goalName(key.slice(5)) : key.slice(4);
          allocRows.push({'Effective From':monthLabel(v.effectiveMonth), Person:p, 'Category / Goal':label, 'Allocation %':Number(v.pct[p][key])});
        });
      });
    });
    addSheet('Allocation Plans', allocRows, [16,10,20,14]);

    XLSX.writeFile(wb, 'income-allocation-tracker-export-'+todayDate()+'.xlsx');
  }

  function renderTabContent(){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.activeTab));
    const c=document.getElementById('tab-content');
    if(state.activeTab==='dashboard') c.innerHTML=dashboardHTML();
    else if(state.activeTab==='analytics') c.innerHTML=analyticsHTML();
    else if(state.activeTab==='goals') c.innerHTML=goalsHTML();
    else if(state.activeTab==='entries') c.innerHTML=entriesHTML();
    else if(state.activeTab==='networth') c.innerHTML=netWorthHTML();
    else c.innerHTML=setupHTML();

  }

  function bindLoginEvents(){
    const mapBtn=document.getElementById('map-submit');
    if(mapBtn){
      mapBtn.addEventListener('click', async()=>{
        const person=document.getElementById('map-person').value;
        state.auth.personByEmail[session.email]=person;
        session.loggedInAs=person;
        await saveState();
        render();
      });
      return;
    }
    const signinBtn=document.getElementById('google-signin-btn');
    if(signinBtn) signinBtn.addEventListener('click', async()=>{
      const errEl=document.getElementById('login-error');
      try{
        await requestToken();
        session.email=await fetchUserEmail();
        await loadStateFromDrive();
        const mapped=state.auth.personByEmail[session.email];
        if(mapped) session.loggedInAs=mapped;
        render();
      }catch(e){ errEl.textContent='Sign-in failed or was cancelled. Try again.'; }
    });
  }

  // ---------------- DASHBOARD ----------------
  function dashboardHTML(){
    const month=state.currentMonth;
    const income=monthIncomeByPerson(month);
    const alloc=allocationForMonth(month);
    const items=planItems();

    const totalIncome=Object.values(income).reduce((a,b)=>a+b,0);
    let totalPlanned=0, totalActual=0;
    state.people.forEach(p=>{
      const pIncome=income[p]||0;
      items.forEach(item=>{ const {planned,actual}=planItemPlannedActual(item,p,month,pIncome); totalPlanned+=planned; totalActual+=actual; });
    });
    const totalVariance=totalActual-totalPlanned;

    let peopleCards=state.people.map(p=>{
      const pIncome=income[p]||0;
      let rows='';
      items.forEach(item=>{
        const {pct,planned,actual}=planItemPlannedActual(item,p,month,pIncome);
        const variance=actual-planned;
        const varPct=planned>0?(variance/planned*100):(actual>0?100:0);
        const over=actual>planned;
        const maxBar=Math.max(planned,actual,1);
        rows+=`
          <div class="cat-row ${item.kind==='goal'?'goal-plan':''}">
            <div class="cat-top">
              <div class="cat-name">${esc(item.label)}${item.kind==='goal'?' <span class="pill blue">goal</span>':''} <span style="color:var(--ink-soft);font-weight:400;">(${pct}%)</span></div>
              <div class="cat-amts">planned <b>${fmtINR(planned)}</b> &nbsp;·&nbsp; actual <b>${fmtINR(actual)}</b></div>
            </div>
            <div class="bar-track">
              <div class="bar-planned" style="width:${Math.min(100,planned/maxBar*100)}%"></div>
              <div class="bar-actual ${over?'over':''}" style="width:${Math.min(100,actual/maxBar*100)}%"></div>
            </div>
            <div class="cat-variance ${over?'bad':(actual>0?'good':'')}">${planned>0||actual>0?(over?'+':'')+fmtINR(variance)+' ('+(varPct>=0?'+':'')+varPct.toFixed(0)+'%)':'—'}</div>
          </div>`;
      });
      return `<div class="person-card"><div class="person-head"><div class="person-name">${esc(p)}</div><div class="person-income">income ${fmtINR(pIncome)}</div></div>${rows}</div>`;
    }).join('');

    let notes=[];
    state.people.forEach(p=>{
      const pIncome=income[p]||0;
      items.forEach(item=>{
        const {planned,actual}=planItemPlannedActual(item,p,month,pIncome);
        if(planned>0){ const varPct=(actual-planned)/planned*100; if(varPct>15) notes.push(`<li><b>${esc(item.label)}</b> (${esc(p)}) exceeded plan by ${varPct.toFixed(0)}%.</li>`); }
      });
    });
    const irregularThisMonth=state.expenses.filter(e=>e.irregular && e.date.slice(0,7)===month);
    const goalWithdrawThisMonth=state.goalTx.filter(t=>t.type==='withdrawal' && t.date.slice(0,7)===month);
    const irregularTotal=irregularThisMonth.reduce((s,e)=>s+Number(e.amount),0)+goalWithdrawThisMonth.reduce((s,t)=>s+Number(t.amount),0);
    if(irregularThisMonth.length||goalWithdrawThisMonth.length) notes.push(`<li>${irregularThisMonth.length+goalWithdrawThisMonth.length} irregular item(s) recorded this month, totalling ${fmtINR(irregularTotal)} — kept out of variance, see below.</li>`);
    if(!alloc) notes.unshift(`<li>No allocation plan set for this month yet — set one up in <b>Setup</b>.</li>`);
    const pending=pendingRecurringTransfers();
    if(pending.length) notes.unshift(`<li>${pending.length} recurring transfer(s) waiting to be logged this month — see <b>Goals</b> tab.</li>`);

    const irregularRows=[...irregularThisMonth.map(e=>({date:e.date,person:e.person,label:e.category+' — '+(e.description||''),amount:e.amount,reason:e.reason})),
      ...goalWithdrawThisMonth.map(t=>{const g=state.goals.find(x=>x.id===t.goalId); return {date:t.date,person:t.person,label:'Goal withdrawal — '+(g?g.name:'?'),amount:t.amount,reason:t.reason};})];

    return `
      <div class="month-nav"><button data-shift="-1">&lsaquo;</button><div class="month-label">${monthLabel(month)}</div><button data-shift="1">&rsaquo;</button></div>
      <div class="summary-row">
        <div class="stat"><div class="label">Household income</div><div class="value">${fmtINR(totalIncome)}</div></div>
        <div class="stat"><div class="label">Planned outflow</div><div class="value">${fmtINR(totalPlanned)}</div></div>
        <div class="stat"><div class="label">Actual outflow</div><div class="value">${fmtINR(totalActual)}</div></div>
        <div class="stat"><div class="label">Irregular spend</div><div class="value ${irregularTotal>0?'bad':''}">${fmtINR(irregularTotal)}</div></div>
      </div>
      <div class="people-grid">${peopleCards}</div>
      <div class="card" style="margin-top:16px;"><h3>Notes</h3>${notes.length?'<ul class="notes">'+notes.join('')+'</ul>':'<div class="empty">Nothing unusual this month.</div>'}</div>
      <div class="card"><h3>Irregular activity this month</h3>
        ${irregularRows.length? `<table><thead><tr><th>Date</th><th>Person</th><th>What</th><th>Reason</th><th class="amt">Amount</th></tr></thead><tbody>
          ${irregularRows.map(r=>`<tr class="irregular"><td>${esc(r.date)}</td><td>${esc(r.person)}</td><td>${esc(r.label)}</td><td>${esc(r.reason||'—')}</td><td class="amt">${fmtINR(r.amount)}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">No irregular activity this month.</div>'}
      </div>
    `;
  }

  // ---------------- ANALYTICS ----------------
  function rangeBounds(){
    const mode=state.analyticsRange.mode;
    const ref=state.currentMonth;
    if(mode==='month') return {start:ref,end:ref};
    if(mode==='quarter') return quarterBounds(ref);
    if(mode==='half') return halfBounds(ref);
    if(mode==='fy') return fyBounds(ref);
    return {start:state.analyticsRange.start||ref, end:state.analyticsRange.end||ref};
  }
  function rangeSummary(start,end){
    const months=monthsBetween(start,end);
    const items=planItems();
    let incomeTotal=0, plannedTotal=0, actualTotal=0;
    let itemPlanned={}, itemActual={}; items.forEach(i=>{itemPlanned[i.key]=0;itemActual[i.key]=0;});
    let personActual={}; state.people.forEach(p=>personActual[p]=0);
    let trend=[], irregularTrend=[];
    months.forEach(m=>{
      const inc=monthIncomeByPerson(m);
      const incSum=Object.values(inc).reduce((a,b)=>a+b,0);
      incomeTotal+=incSum;
      let mPlanned=0,mActual=0;
      state.people.forEach(p=>{
        const pInc=inc[p]||0;
        items.forEach(item=>{
          const {planned,actual}=planItemPlannedActual(item,p,m,pInc);
          itemPlanned[item.key]+=planned; itemActual[item.key]+=actual;
          personActual[p]+=actual;
          mPlanned+=planned; mActual+=actual;
        });
      });
      plannedTotal+=mPlanned; actualTotal+=mActual;
      trend.push({label:monthLabel(m),actual:mActual,planned:mPlanned});
      const irrExp=state.expenses.filter(e=>e.irregular && e.date.slice(0,7)===m).reduce((s,e)=>s+Number(e.amount),0);
      const irrGoal=state.goalTx.filter(t=>t.type==='withdrawal' && t.date.slice(0,7)===m).reduce((s,t)=>s+Number(t.amount),0);
      irregularTrend.push({label:monthLabel(m), value:irrExp+irrGoal});
    });
    let irregular=[]; let irregularByLabel={};
    state.expenses.filter(e=>e.irregular && months.includes(e.date.slice(0,7))).forEach(e=>{
      irregular.push({date:e.date,person:e.person,label:e.category+' — '+(e.description||''),amount:e.amount,reason:e.reason});
      irregularByLabel[e.category]=(irregularByLabel[e.category]||0)+Number(e.amount);
    });
    state.goalTx.filter(t=>t.type==='withdrawal' && months.includes(t.date.slice(0,7))).forEach(t=>{
      const g=state.goals.find(x=>x.id===t.goalId); const lbl='Goal withdrawal — '+(g?g.name:'?');
      irregular.push({date:t.date,person:t.person,label:lbl,amount:t.amount,reason:t.reason});
      irregularByLabel[lbl]=(irregularByLabel[lbl]||0)+Number(t.amount);
    });
    const assetSeries=months.map(m=>{const cutoff=m+'-31'; return {label:monthLabel(m), invested:totalInvestedAsOf(cutoff), current:totalCurrentValueAsOf(cutoff)};});
    const contribSeries=months.map(m=>({label:monthLabel(m), value: state.assetTx.filter(t=>t.kind==='contribution'&&t.date.slice(0,7)===m).reduce((s,t)=>s+Number(t.amount),0)}));
    return {months,items,incomeTotal,plannedTotal,actualTotal,itemPlanned,itemActual,personActual,trend,irregular,irregularTrend,irregularByLabel,assetSeries,contribSeries};
  }

          <div><label>To</label><input type="month" id="range-end" value="${state.analyticsRange.end||end}"></div>
        ` : `<div style="align-self:center;font-family:var(--mono);font-size:13px;color:var(--ink-soft);padding-bottom:8px;">${monthLabel(start)} – ${monthLabel(end)}</div>`}
      </div>

      <div class="summary-row">

        <div class="stat"><div class="label">Variance</div><div class="value ${s.actualTotal>s.plannedTotal?'bad':'good'}">${s.actualTotal>s.plannedTotal?'+':''}${fmtINR(s.actualTotal-s.plannedTotal)}</div></div>

        <div class="card"><h4>Spend by person</h4>${pieChart(personPie)}

        <div class="legend"><span><i style="background:#4b5b66;opacity:.35"></i>Planned</span><span><i style="background:#c1893a"></i>Actual (on/under plan)</span><span><i style="background:#d1483a"></i>Actual (over plan)</span></div>

  // ---------------- GOALS ----------------
  function goalsHTML(){

    const assetOpts=state.assets.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');

    const pending=pendingRecurringTransfers();

        }).join('') : `<div class="empty">All recurring transfers are logged for ${monthLabel(month)}.</div>`}

        <table><thead><tr><th>Label</th><th>Goal → Asset</th><th>Person</th><th class="amt">Amount</th><th></th></tr></thead><tbody>
          ${state.recurringTransfers.map(r=>{
            const g=state.goals.find(x=>x.id===r.goalId), a=state.assets.find(x=>x.id===r.assetId);
            return `<tr><td>${esc(r.label||'—')}</td><td>${esc(g?g.name:'?')} → ${esc(a?a.name:'?')}</td><td>${esc(r.person)}</td><td class="amt">${fmtINR(r.amount)}</td><td class="row-actions"><button data-del-recurring="${r.id}">Delete rule</button></td></tr>`;

      </div>` : '';

    const goalCards=state.goals.map(g=>{
      const bal=goalBalance(g.id);
      const pct=Math.min(100,g.targetAmount>0?bal/g.targetAmount*100:0);
      const alloc=allocationForMonth(month);
      const income=monthIncomeByPerson(month);
      const monthlyPlanned=state.people.reduce((sum,p)=>{
        const pct2=(alloc&&alloc.pct[p]&&alloc.pct[p]['goal:'+g.id])||0;
        return sum+(income[p]||0)*pct2/100;
      },0);
      const remaining=Math.max(0,g.targetAmount-bal);
      const monthsLeft=monthlyPlanned>0? Math.ceil(remaining/monthlyPlanned) : null;
      const tx=goalTxForGoal(g.id).sort((a,b)=>b.date.localeCompare(a.date));
      const editingGoal=state._editGoalId===g.id;

      const goalHeader = editingGoal ? `
        <div class="form-grid">
          <div><label>Name</label><input type="text" data-edit-goal-field="name" value="${esc(g.name)}"></div>

          <div><label>Account</label><select data-edit-goal-field="account">${state.accounts.map(a=>`<option ${a.name===g.account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
          <div><button class="btn small" data-save-goal="${g.id}">Save</button> <button class="btn secondary small" data-cancel-edit-goal="1">Cancel</button></div>
        </div>` : `
        <div class="goal-top">
          <div class="goal-name">${esc(g.name)}</div>
          <div class="row-actions"><button data-edit-goal="${g.id}">Edit</button><button data-del-goal="${g.id}">Delete goal</button></div>
        </div>
        <div class="goal-sub">${fmtINR(bal)} saved of ${fmtINR(g.targetAmount)} target · parked in ${esc(g.account||'—')}${monthsLeft!=null?' · ~'+monthsLeft+' more months at current planned pace':''}</div>
        <div class="progress-track"><div class="progress-fill ${pct>=100?'done':''}" style="width:${pct}%"></div></div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Planned monthly contribution set in Setup → Allocation plan (currently ${fmtINR(monthlyPlanned)}/mo combined).</div>`;

      return `
        <div class="goal-card">

  function runSearch(){
    const q=(document.getElementById('search-q').value||'').toLowerCase();
    const person=document.getElementById('search-person').value;
    const type=document.getElementById('search-type').value;
    const category=document.getElementById('search-category').value;
    const account=document.getElementById('search-account').value;
    const from=document.getElementById('search-from').value;
    const to=document.getElementById('search-to').value;
    const min=document.getElementById('search-min').value;
    const max=document.getElementById('search-max').value;
    let results=[];
    if(!type||type==='income') state.income.forEach(r=>results.push({kind:'income',date:r.date,person:r.person,text:r.source,category:'',account:r.account,amount:r.amount}));
    if(!type||type==='expense') state.expenses.forEach(r=>results.push({kind:'expense',date:r.date,person:r.person,text:(r.category+' '+(r.description||'')+' '+(r.reason||'')),category:r.category,account:r.account,amount:r.amount}));
    if(!type||type==='transfer') state.transfers.forEach(r=>results.push({kind:'transfer',date:r.date,person:r.person,text:(r.fromAccount+' to '+r.toAccount+' '+(r.note||'')),category:'',account:r.fromAccount,amount:r.amount}));
    results=results.filter(r=>{
      if(q && !r.text.toLowerCase().includes(q)) return false;
      if(person && r.person!==person) return false;
      if(category && r.category!==category) return false;
      if(account && r.account!==account) return false;
      if(from && r.date<from) return false;
      if(to && r.date>to) return false;
      if(min && Number(r.amount)<Number(min)) return false;
      if(max && Number(r.amount)>Number(max)) return false;
      return true;
    }).sort((a,b)=>b.date.localeCompare(a.date));
    const area=document.getElementById('search-results');
    if(!results.length){ area.innerHTML='<div class="empty">No matching records.</div>'; return; }
    area.innerHTML=`<table><thead><tr><th>Date</th><th>Type</th><th>Person</th><th>Detail</th><th>Account</th><th class="amt">Amount</th></tr></thead><tbody>
      ${results.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.kind)}</td><td>${esc(r.person)}</td><td>${esc(r.text)}</td><td>${esc(r.account||'—')}</td><td class="amt">${fmtINR(r.amount)}</td></tr>`).join('')}
    </tbody></table>`;
  }

  // ---------------- NET WORTH ----------------
  function netWorthHTML(){
    const filter = state.netWorthFilter || 'all';
    const filterOptions = ['all'].concat(state.people).concat(['Joint']);
    const filterLabel = f => f==='all' ? 'All (household)' : f;

    const fAccounts = state.accounts.filter(a=>ownerMatches(a.owner, filter));

    const includeGoals = (filter==='all' || filter==='Joint');

    const totalAssets = fAssets.reduce((s,a)=>s+assetCurrentValue(a.id),0)

    const netWorth = totalAssets - totalLiabilities;
